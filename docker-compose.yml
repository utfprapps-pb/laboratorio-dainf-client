########################### SERVICES
services:
  ########################### DAINF LABS CLIENT    
  dainf-labs-old:        
    image: dainf-labs-old
    container_name: dainf-labs-old
    build:
      context: ./
      dockerfile: Dockerfile    
    environment:
      - TZ=America/Sao_Paulo
    ports:
      - "8998:80"      
    labels:
      # Traefik Config
      - "traefik.enable=true"
      - "traefik.http.routers.dainf-labs-old.tls=true"
      - "traefik.http.routers.dainf-labs-old.rule=Host(`dainf-labs-old.app.pb.utfpr.edu.br`)"
      - "traefik.http.routers.dainf-labs-old.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dainf-labs-old.entrypoints=websecure"      
    
    restart: unless-stopped
    networks:
      - web

########################### NETWORKS
networks:
  web:
    external: true