########################### SERVICES
services:
  ########################### LABS CLIENT
  ${DOCKER_IMAGE_NAME}:
    image: "${DOCKER_IMAGE_NAME}:${DOCKER_TAG}"
    container_name: ${DOCKER_IMAGE_NAME}
    build:
      context: ./
      dockerfile: ${DOCKER_FILE}
    environment:
      - TZ=America/Sao_Paulo
    ports:
      - "${HOST_PORT}:${CONTAINER_PORT}"
    labels:
      # Traefik Config
      - "traefik.enable=true"
      - "traefik.http.routers.${DOCKER_IMAGE_NAME}.tls=true"
      - "traefik.http.routers.${DOCKER_IMAGE_NAME}.rule=Host(`${CLIENT_URL}`)"
      - "traefik.http.routers.${DOCKER_IMAGE_NAME}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${DOCKER_IMAGE_NAME}.entrypoints=websecure"

    restart: unless-stopped
    networks:
      - web

########################### NETWORKS
networks:
  web:
    external: true
